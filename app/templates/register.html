{% extends "base.html" %}

{% block content %}
<div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
    <div class="detail-card" style="width: 100%; max-width: 400px;">
        <h2 style="text-align: center; margin-bottom: 2rem;">Criar Conta</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div
            style="background: rgba(255,165,0,0.1); border: 1px solid orange; color: white; padding: 10px; border-radius: 8px; margin-bottom: 1rem; text-align: center;">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth_bp.register') }}"
            style="display: flex; flex-direction: column; gap: 1rem;">
            <div>
                <label style="display: block; margin-bottom: 5px; color: var(--text-muted);">Nome</label>
                <input type="text" name="name" required
                    style="width: 100%; background: var(--bg-input); border: 1px solid var(--border); padding: 0.8rem; color: white; border-radius: 8px;">
            </div>

            <div>
                <label style="display: block; margin-bottom: 5px; color: var(--text-muted);">Email</label>
                <input type="email" name="email" required
                    style="width: 100%; background: var(--bg-input); border: 1px solid var(--border); padding: 0.8rem; color: white; border-radius: 8px;">
            </div>

            <div>
                <label style="display: block; margin-bottom: 5px; color: var(--text-muted);">Senha</label>
                <input type="password" name="password" required
                    style="width: 100%; background: var(--bg-input); border: 1px solid var(--border); padding: 0.8rem; color: white; border-radius: 8px;">
            </div>

            <button type="submit" class="btn-dashboard" style="width: 100%; cursor: pointer; margin-top: 1rem;">
                Cadastrar
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">
            Já tem conta? <a href="{{ url_for('auth_bp.login') }}" style="color: var(--primary);">Entrar</a>
        </div>
    </div>
</div>
{% endblock %}
