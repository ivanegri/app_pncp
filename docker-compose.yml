services:
  web:
    build: https://github.com/ivanegri/app_pncp.git#main
    ports:
      - "18123:5000"
    environment:
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
    volumes:
      - .:/app
      - /app/venv
      - /app/__pycache__
      - ${GOOGLE_CREDENTIALS_PATH}:/app/credentials.json:ro
  # Local DB service (Commented out for Remote DB usage)
